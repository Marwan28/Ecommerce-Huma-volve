<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>افتح التطبيق</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Roboto, Helvetica, Arial, sans-serif;
      color: #222;
    }
    .card {
      background: #fff;
      max-width: 360px;
      width: 90%;
      padding: 32px 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.6; color: #555; margin: 0 0 24px; }
    a.btn {
      display: block;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: #039be5;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>حمّل التطبيق</h1>
  <p>لو التطبيق متسطب على موبايلك، افتح اللينك تاني وهيفتح فيه مباشرة.</p>
  <a class="btn" id="android" href="#">Google Play</a>
  <a class="btn" id="ios" href="#">App Store</a>
</div>

<script>
  // غيّر اللينكات دي للينكات التطبيق الحقيقية
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.example.yourapp";
  var APPSTORE_URL = "https://apps.apple.com/app/idXXXXXXXXXX";

  document.getElementById("android").href = PLAY_URL;
  document.getElementById("ios").href = APPSTORE_URL;

  var ua = navigator.userAgent || "";
  if (/android/i.test(ua)) {
    document.getElementById("ios").style.display = "none";
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    document.getElementById("android").style.display = "none";
  }
</script>
</body>
</html>
